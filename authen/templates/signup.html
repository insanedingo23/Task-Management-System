{% extends "main.html" %}
{% block content %}
    <h1>Register your details here...</h1>
    <form method="post">
        {% csrf_token %}
        <input type="text" name="fn" placeholder="FIRST NAME" required> <br> 
        <input type="text" name="ln" placeholder="LAST NAME" required> <br>
        <input type="email" name="email" placeholder="EMAIL" required> <br>
        <input type="text" name="un" placeholder="USERNAME" required> <br>
        <input type="password" name="pw" placeholder="PASSWORD" required> <br>
        <button type="submit">SUBMIT</button>
    </form>
    <p>Already have an account?? Click <a href="{% url 'signin' %}">here.</a></p>
{% endblock %}
